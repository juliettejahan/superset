name: Trigger Devin Test Coverage Session

on:
  issues:
    types: [labeled]

jobs:
  trigger-devin:
    if: contains(github.event.issue.labels.*.name, 'test-coverage')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Devin Fixer Session
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_CONCURRENT = 10;

            const title = context.payload.issue.title;
            if (!title.includes("[Test Coverage]")) {
              console.log("Issue title does not match [Test Coverage] pattern, skipping.");
              return;
            }

            // Check how many fixer sessions are currently active
            const listResp = await fetch(
              `https://api.devin.ai/v3/organizations/${{ secrets.DEVIN_ORG_ID }}/sessions?tags=fixer&tags=test-coverage`,
              {
                headers: {
                  "Authorization": `Bearer ${{ secrets.DEVIN_API_KEY }}`,
                  "Content-Type": "application/json"
                }
              }
            );
            if (listResp.ok) {
              const listData = await listResp.json();
              const allSessions = listData.items || [];
              // Count only sessions that are actively running
              const activeCount = allSessions.filter(s => s.status === "running").length;
              if (activeCount >= MAX_CONCURRENT) {
                console.log(`Concurrency limit reached: ${activeCount}/${MAX_CONCURRENT} fixer sessions active. Skipping.`);
                return;
              }
              console.log(`Active fixer sessions: ${activeCount}/${MAX_CONCURRENT}`);
            } else {
              console.log(`Warning: Could not check active sessions (${listResp.status}), proceeding anyway.`);
            }

            // Extract database name from title
            // e.g. "[Test Coverage] Improve unit test coverage for VerticaEngineSpec"
            const dbMatch = title.match(/for\s+(\w+?)(?:EngineSpec|Spec)?\s*$/i);
            const database = dbMatch ? dbMatch[1] : "unknown";
            const dbLower = database.toLowerCase();

            const issueNumber = context.payload.issue.number;
            const issueUrl = context.payload.issue.html_url;
            const issueBody = context.payload.issue.body || "";
            const repo = context.payload.repository.full_name;

            console.log(`Triggering Devin fixer session for ${database} (issue #${issueNumber})`);

            // Structured output schema for the fixer session
            const fixerOutputSchema = {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "title": "TestCoverageFixerOutput",
              "type": "object",
              "required": [
                "database_name", "engine_spec_class", "source_file", "test_file",
                "issue_number", "coverage_before", "coverage_after",
                "tests_added", "tests_passed", "status"
              ],
              "properties": {
                "database_name": { "type": "string", "description": "Name of the DB engine" },
                "engine_spec_class": { "type": "string", "description": "Class name" },
                "source_file": { "type": "string", "description": "Path to source file" },
                "test_file": { "type": "string", "description": "Path to test file" },
                "issue_number": { "type": "integer", "description": "GitHub issue number" },
                "issue_url": { "type": "string", "description": "URL to the GitHub issue" },
                "pr_number": { "type": "integer", "description": "PR number (0 if none)" },
                "pr_url": { "type": "string", "description": "URL to the PR" },
                "coverage_before": { "type": "number", "description": "Branch coverage % before" },
                "coverage_after": { "type": "number", "description": "Branch coverage % after" },
                "tests_added": { "type": "integer", "description": "Number of new tests" },
                "tests_passed": { "type": "boolean", "description": "Whether all tests pass" },
                "methods_tested": { "type": "array", "items": { "type": "string" } },
                "methods_missing": { "type": "array", "items": { "type": "string" } },
                "status": { "type": "string", "enum": ["completed", "failed", "partial"] },
                "notes": { "type": "string", "description": "Summary of what was done" }
              }
            };

            const payload = {
              playbook_id: "${{ vars.DEVIN_COVERAGE_PLAYBOOK_ID }}",
              prompt: `Resolve this test-coverage issue #${issueNumber} on ${repo}:\n\nTitle: ${title}\n\nBody:\n${issueBody}\n\nFollow the attached playbook to implement the fix. Create a PR that references issue #${issueNumber}.\n\nIMPORTANT: Before completing, update your structured output with the coverage data as specified in the playbook's Structured Output section.`,
              title: `[Fixer] ${database}: ${title}`,
              structured_output_schema: fixerOutputSchema,
              child_playbook_id: "${{ vars.DEVIN_REVIEWER_PLAYBOOK_ID }}",
              repos: [repo],
              tags: [
                "test-coverage",
                "fixer",
                "automated",
                "trigger-github-action",
                `issue-${issueNumber}`,
                `repo-${repo.replace("/", "-")}`,
                `db-${dbLower}`
              ]
            };

            const response = await fetch(
              `https://api.devin.ai/v3/organizations/${{ secrets.DEVIN_ORG_ID }}/sessions`,
              {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${{ secrets.DEVIN_API_KEY }}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
              }
            );

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`Devin API returned ${response.status}: ${errorText}`);
              return;
            }

            const data = await response.json();
            console.log(`Devin session created: ${data.url}`);
            console.log(`Session ID: ${data.session_id}`);
            console.log(`Child playbook (reviewer) will auto-spawn when PR is created`);

            // Post a comment on the issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🔧 **Devin fixer session spawned by GitHub Actions**\n\n- **Session:** ${data.url}\n- **Database:** ${database}\n- **Playbook:** Test Coverage Fixer\n- **Child review:** Will auto-spawn a reviewer session when the PR is created\n- **Structured output:** Coverage metrics will be captured automatically`
            });
